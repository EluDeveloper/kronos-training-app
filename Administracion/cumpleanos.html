<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleañeros Junio - Kronos Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kronos: {
                            orange: '#FF401B',
                            teal: '#44797F',
                            light: '#97D5DE',
                            dark: '#1B1D1A',
                            gray: '#EBEBEB'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f3f4f6;
        }

        .letter-spacing-tighter {
            letter-spacing: -0.05em;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Contenedor Principal (Proporción tipo Historia/Flyer) -->
    <div
        class="relative w-full max-w-[400px] bg-white min-h-[800px] shadow-2xl overflow-hidden flex flex-col pt-0 pb-10">

        <!-- Decoración Fondo: Círculo Celeste Inferior Derecho -->
        <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-kronos-light opacity-30 rounded-full z-0"></div>

        <!-- Decoración Fondo: Estrella Izquierda -->
        <svg class="absolute top-1/3 -left-16 w-48 h-48 text-kronos-gray opacity-40 z-0" viewBox="0 0 24 24"
            fill="currentColor">
            <path
                d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z" />
        </svg>

        <!-- Banderines Superiores -->
        <div class="w-full flex justify-between items-start px-2 z-10">
            <svg class="w-12 h-16 text-kronos-orange" preserveAspectRatio="none" viewBox="0 0 100 100"
                fill="currentColor">
                <polygon points="0,0 100,0 100,100 50,75 0,100" />
            </svg>
            <svg class="w-12 h-16 text-kronos-teal" preserveAspectRatio="none" viewBox="0 0 100 100"
                fill="currentColor">
                <polygon points="0,0 100,0 100,100 50,75 0,100" />
            </svg>
            <svg class="w-12 h-16 text-kronos-light" preserveAspectRatio="none" viewBox="0 0 100 100"
                fill="currentColor">
                <polygon points="0,0 100,0 100,100 50,75 0,100" />
            </svg>
            <svg class="w-12 h-16 text-kronos-orange" preserveAspectRatio="none" viewBox="0 0 100 100"
                fill="currentColor">
                <polygon points="0,0 100,0 100,100 50,75 0,100" />
            </svg>
            <svg class="w-12 h-16 text-kronos-teal" preserveAspectRatio="none" viewBox="0 0 100 100"
                fill="currentColor">
                <polygon points="0,0 100,0 100,100 50,75 0,100" />
            </svg>
        </div>

        <!-- Encabezado -->
        <div class="text-center mt-8 mb-6 z-10">
            <h2 class="text-kronos-teal text-3xl font-extrabold lowercase leading-none tracking-tight">cumpleaños</h2>
            <h1 class="text-kronos-orange text-7xl font-black uppercase letter-spacing-tighter leading-none mt-[-5px]">
                JUNIO</h1>
        </div>

        <!-- Lista de Cumpleañeros -->
        <div class="flex flex-col items-center space-y-5 z-10 flex-grow px-4">

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 2</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Karina</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 3</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Vanessa Morales</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 4</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Nancy Garduño Flores</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 5</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Laura Muñiz Solano</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Norma Angélica Sánchez Álvarez
                </p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 9</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Omar Vara</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 17</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Luis Puentes</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 21</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Regina Maria Morales Prado</p>
            </div>

            <div class="text-center">
                <p class="text-kronos-teal text-xs font-bold tracking-[0.2em] uppercase mb-1">Junio 28</p>
                <p class="text-kronos-dark text-[1.15rem] font-extrabold leading-tight">Wendy Morales</p>
            </div>

        </div>

        <!-- Footer / Icono de Pastel -->
        <div class="relative w-full flex items-end justify-between mt-8 px-6 z-10">
            <!-- Icono Pastel -->
            <div class="w-16 h-16 relative flex flex-col items-center justify-end">
                <!-- Fuego -->
                <svg class="w-4 h-6 text-kronos-orange absolute -top-4" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C12 2 7 9.5 7 14C7 16.7614 9.23858 19 12 19C14.7614 19 17 16.7614 17 14C17 9.5 12 2 12 2Z" />
                </svg>
                <!-- Vela -->
                <div class="w-1 h-3 bg-kronos-dark rounded-t-sm relative z-10"></div>
                <!-- Nivel Superior Pastel -->
                <div class="w-10 h-3 bg-kronos-orange rounded-t-sm"></div>
                <!-- Nivel Medio Pastel -->
                <div class="w-14 h-4 bg-kronos-teal rounded-t-sm"></div>
                <!-- Base Pastel -->
                <div class="w-16 h-4 bg-kronos-dark rounded-t-sm"></div>
            </div>

            <!-- Línea separadora pie de página -->
            <div class="absolute bottom-2 w-full left-0 px-8 flex items-center justify-center space-x-2">
                <div class="h-px bg-gray-300 flex-grow"></div>
                <span class="text-[0.65rem] font-bold tracking-widest text-gray-400 uppercase">Kronos Training</span>
                <div class="h-px bg-gray-300 flex-grow"></div>
            </div>
        </div>

    </div>
</body>

</html>
