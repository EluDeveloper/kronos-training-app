        // --- LÓGICA DE LA APLICACIÓN ---
        const cardsContainer = document.getElementById('cards-container');
        const weekFilters = document.querySelectorAll('#week-filters button');
        const dayFilters = document.querySelectorAll('#day-filters button');
        const compBtn = document.getElementById('comp-btn');
        const header = document.getElementById('main-header');
        const weekTitle = document.getElementById('week-title');
        const volBadge = document.getElementById('vol-badge');
        const intBadge = document.getElementById('int-badge');
        const focBadge = document.getElementById('foc-badge');

        let currentWeek = 1;
        let currentDay = "all";

        function renderCards() {
            cardsContainer.innerHTML = '';
            const meta = metaData[currentWeek];
            weekTitle.textContent = meta.title;
            volBadge.textContent = meta.vol;
            intBadge.textContent = meta.int;
            focBadge.textContent = meta.foc;

            header.className = `max-w-7xl mx-auto mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border-l-4 shadow-xl transition-all duration-300 ${meta.color}`;
            weekTitle.className = `text-2xl font-heading ${meta.text}`;
            intBadge.className = `text-xl font-heading ${meta.text}`;

            // Mostrar u ocultar el botón de competencia solo en la semana 6
            if (currentWeek === 6) {
                compBtn.classList.remove('hidden');
            } else {
                compBtn.classList.add('hidden');
                if (currentDay === 'Competicion') {
                    currentDay = 'all';
                    dayFilters.forEach(b => b.classList.remove('btn-active'));
                    dayFilters[0].classList.add('btn-active');
                }
            }

            const filteredWods = workouts.filter(w => w.week === currentWeek && (currentDay === 'all' || w.day.toLowerCase() === currentDay.toLowerCase()));

            filteredWods.forEach(w => {
                const isDouble = w.day === "Competicion";
                const isFri = w.day === "Viernes" && currentWeek === 6;
                const colSpan = (isDouble || isFri) ? 'lg:col-span-3' : '';

                let cardHTML = `
                    <article class="bg-slate-800 rounded-xl border ${isDouble ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-700'} overflow-hidden card-hover ${colSpan}">
                       <div class="${isDouble ? 'bg-black' : (w.day === 'Miercoles' ? 'bg-blue-900' : 'bg-slate-900')} p-4 border-b border-slate-700 flex justify-between items-center relative overflow-hidden">
                          ${isDouble ? '<div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #ef4444 10px, #ef4444 20px);"></div>' : ''}
                          <div class="relative z-10">
                              <h3 class="text-3xl font-heading ${isDouble ? 'text-red-500' : 'text-white'} tracking-widest">${w.day.toUpperCase()}</h3>
                              <span class="text-xs ${isDouble ? 'text-slate-300' : 'text-amber-500'} font-bold uppercase tracking-widest">${w.header}</span>
                          </div>
                          ${isDouble ? '<span class="px-3 py-1 bg-red-600 rounded text-xs font-bold uppercase tracking-wider text-white relative z-10">Evento Principal</span>' : ''}
                       </div>
                       <div class="flex flex-col md:${isDouble ? 'grid md:grid-cols-2 gap-4 p-4' : 'flex-col'}">
                `;

                // Render Timeline Items
                let timelineHTML = '';
                w.timeline.forEach(item => {
                    timelineHTML += `
                        <div class="flex stretch group">
                            <div class="${item.style.c} w-2 md:w-3 shrink-0 transition-all group-hover:w-4"></div>
                            <div class="p-3 pb-4 border-b border-slate-700/50 flex-1 bg-slate-800/30">
                                <div class="font-bold text-xs ${item.style.t} mb-1 tracking-wider uppercase font-heading text-lg flex items-center gap-2">
                                    <span class="bg-black/50 px-2 py-0.5 rounded text-sm font-sans">${item.time}</span> ${item.title}
                                </div>
                                <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">${item.desc}</div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += timelineHTML;
                cardHTML += `</div></article>`;
                cardsContainer.innerHTML += cardHTML;
            });
        }

        weekFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                weekFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentWeek = parseInt(e.target.getAttribute('data-target'));
                renderCards();
            });
        });

        dayFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                dayFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentDay = e.target.getAttribute('data-target');
                renderCards();
            });
        });

        renderCards();
    </script>
