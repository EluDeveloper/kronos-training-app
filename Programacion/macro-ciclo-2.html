            }
        ];

        function formatDesc(desc) {
            if (!desc) return '';
            const d = desc.trim();
            if (d.includes('\n')) {
                const lines = d.split('\n').map(l => l.trim()).filter(Boolean);
                if (lines.some(l => /^[-•\u2022\*]/.test(l) || l.startsWith('-') || l.startsWith(' -'))) {
                    const lis = lines.map(l => `<li>${l.replace(/^[-•\u2022\*\s-]+/, '').trim()}</li>`).join('');
                    return `<ul class="list-disc ml-4 mt-1 text-slate-300">${lis}</ul>`;
                }
                return d.replace(/\n/g, '<br>');
            }
            return `<span>${d}</span>`;
        }

        const cardsContainer = document.getElementById('cards-container');
        const weekFilters = document.querySelectorAll('#week-filters button');
        const dayFilters = document.querySelectorAll('#day-filters button');
        const header = document.getElementById('main-header');
        const weekTitle = document.getElementById('week-title');
        const volBadge = document.getElementById('vol-badge');
        const intBadge = document.getElementById('int-badge');
        const focBadge = document.getElementById('foc-badge');

        let currentWeek = 1;
        let currentDay = "all";

        function renderCards() {
            cardsContainer.innerHTML = '';
            const meta = metaData[currentWeek];
            weekTitle.textContent = meta.title;
            volBadge.textContent = meta.vol;
            intBadge.textContent = meta.int;
            focBadge.textContent = meta.foc;

            header.className = `max-w-7xl mx-auto mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border-l-4 shadow-xl transition-all duration-300 ${meta.color}`;
            weekTitle.className = `text-2xl font-heading ${meta.text}`;
            intBadge.className = `text-xl font-heading ${meta.text}`;

            const filteredWods = workouts.filter(w => w.week === currentWeek && (currentDay === 'all' || w.day.toLowerCase() === currentDay.split(' ')[0].toLowerCase()));

            filteredWods.forEach(w => {
                const isDouble = w.day.includes("Sabado");
                const isPartner = w.header.includes("PARTNER DAY");
                const colSpan = isDouble ? 'lg:col-span-3' : '';

                // Color coding for card header
                let borderColor = 'border-slate-700';
                let headerText = 'text-white';
                let subText = 'text-emerald-500';

                if (isDouble) {
                    borderColor = 'border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.2)]';
                    headerText = 'text-amber-500';
                } else if (isPartner) {
                    borderColor = 'border-pink-500 shadow-[0_0_15px_rgba(219,39,119,0.2)]';
                    headerText = 'text-pink-500';
                }

                let cardHTML = `
                    <article class="bg-slate-800 rounded-xl border ${borderColor} overflow-hidden card-hover ${colSpan}">
                       <div class="${isDouble || isPartner ? 'bg-black' : 'bg-slate-900'} p-4 border-b border-slate-700 flex justify-between items-center relative overflow-hidden">
                          <div class="relative z-10">
                              <h3 class="text-3xl font-heading ${headerText} tracking-widest">${w.day.toUpperCase()}</h3>
                              <span class="text-xs ${subText} font-bold uppercase tracking-widest">${w.header}</span>
                          </div>
                       </div>
                       <div class="flex flex-col md:${isDouble ? 'grid md:grid-cols-2 gap-4 p-4' : 'flex-col'}">
                `;

                let timelineHTML = '';
                w.timeline.forEach(item => {
                    let styleObj = item.style || C.WOD;
                    timelineHTML += `
                        <div class="flex stretch group">
                            <div class="${styleObj.c} w-2 md:w-3 shrink-0 transition-all group-hover:w-4"></div>
                            <div class="p-3 pb-4 border-b border-slate-700/50 flex-1 bg-slate-800/30">
                                <div class="font-bold text-xs ${styleObj.t} mb-1 tracking-wider uppercase font-heading text-lg flex items-center gap-2">
                                    <span class="bg-black/50 px-2 py-0.5 rounded text-sm font-sans">${item.time}</span> ${item.title}
                                </div>
                                <div class="text-sm text-slate-300 leading-relaxed">${formatDesc(item.desc)}</div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += timelineHTML;
                cardHTML += `</div></article>`;
                cardsContainer.innerHTML += cardHTML;
            });
        }

        weekFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                weekFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentWeek = parseInt(e.target.getAttribute('data-target'));
                renderCards();
            });
        });

        dayFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                dayFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentDay = e.target.getAttribute('data-target');
                renderCards();
            });
        });

        renderCards();
    </script>
</body>

</html>
