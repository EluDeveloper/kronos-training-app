<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Programming - Macrociclo 6 Semanas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        h1,
        h2,
        h3,
        .font-heading {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 0.05em;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);
        }

        .btn-active {
            background-color: #f59e0b !important;
            color: #0f172a !important;
            border-color: #f59e0b !important;
        }

        .pulse-red {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <!-- Header Section -->
    <header
        class="max-w-7xl mx-auto mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border-l-4 border-amber-500 shadow-xl transition-all duration-300"
        id="main-header">
        <div>
            <h1 class="text-5xl md:text-6xl text-white mb-2 tracking-wide">KRONOS <span
                    class="text-amber-500">PROGRAMMING</span></h1>
            <h2 class="text-2xl text-slate-400 font-heading" id="week-title">Semana 1: Adaptación Anatómica</h2>
        </div>
        <div class="mt-6 md:mt-0 grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">

                <span class="text-xl font-heading text-white" id="vol-badge">Alto</span>
            </div>
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                <span class="block text-xs text-slate-400 uppercase tracking-wider font-bold">Intensidad</span>
                <span class="text-xl font-heading text-amber-500" id="int-badge">60-65% RM</span>
            </div>
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 col-span-2 md:col-span-1">
                <span class="block text-xs text-slate-400 uppercase tracking-wider font-bold">Foco</span>
                <span class="text-xl font-heading text-white" id="foc-badge">Estabilidad</span>
            </div>
        </div>
    </header>

    <!-- Controls Section -->
    <section class="max-w-7xl mx-auto mb-8 bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="mb-4">

                    class="filter-btn btn-active px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"
                    data-filter-type="week" data-target="1">Semana 1</button>
                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"
                    data-filter-type="week" data-target="2">Semana 2</button>
                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"
                    data-filter-type="week" data-target="3">Semana 3</button>
                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"
                    data-filter-type="week" data-target="4">Semana 4</button>
                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

            </div>
        </div>
        <div>
            <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">Selecciona el Día:</h3>
            <div class="flex flex-wrap gap-2" id="day-filters">
                <button
                    class="filter-btn btn-active px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"
                    data-filter-type="day" data-target="all">Semana Completa</button>
                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

                <button
                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

                    class="filter-btn px-4 py-2 bg-slate-800 border border-slate-600 rounded font-bold text-sm text-slate-300 hover:bg-slate-700 transition"

        </div>
    </section>

    </main>

        function formatDesc(desc) {
            if (!desc) return '';
            const d = desc.trim();

            if (d.includes('\n')) {
                const lines = d.split('\n').map(l => l.trim()).filter(Boolean);
                if (lines.some(l => /^[-•\u2022\*]/.test(l) || l.startsWith('-') || l.startsWith(' -'))) {
                    const lis = lines.map(l => `<li>${l.replace(/^[-•\u2022\*\s-]+/, '').trim()}</li>`).join('');
                    return `<ul class="list-disc ml-4 mt-1 text-slate-300">${lis}</ul>`;
                }
                if (lines.length > 1 && lines[0].includes(':')) {
                    const prefix = lines[0].split(':')[0];
                    const items = lines.slice(1).map(l => l.replace(/^[-•\u2022\*\s-]+/, '').trim()).filter(Boolean);
                    if (items.length) {
                        const lis = items.map(i => `<li>${i}</li>`).join('');
                        return `${prefix}: <ul class="list-disc ml-4 mt-1 text-slate-300">${lis}</ul>`;
                    }
                }
                return d.replace(/\n/g, '<br>');
            }

            if (d.includes(':') && d.split(':', 2)[1].includes(',')) {
                const parts = d.split(':');
                const prefix = parts.shift();
                const rest = parts.join(':').split(',').map(p => p.trim()).filter(Boolean);
                if (rest.length > 1) {
                    const lis = rest.map(i => `<li>${i}</li>`).join('');
                    return `${prefix}: <ul class="list-disc ml-4 mt-1 text-slate-300">${lis}</ul>`;
                }
            }

            const commaCount = (d.match(/,/g) || []).length;
            if (commaCount >= 1 && d.length < 140) {
                const items = d.split(',').map(p => p.trim()).filter(Boolean);
                if (items.length > 1) {
                    const lis = items.map(i => `<li>${i}</li>`).join('');
                    return `<ul class="list-disc ml-4 mt-1 text-slate-300">${lis}</ul>`;
                }
            }
            return `<span>${d}</span>`;
        }

        const cardsContainer = document.getElementById('cards-container');

        const dayFilters = document.querySelectorAll('#day-filters button');

        const volBadge = document.getElementById('vol-badge');
        const intBadge = document.getElementById('int-badge');
        const focBadge = document.getElementById('foc-badge');

        let currentWeek = 1;
        let currentDay = "all";

        function renderCards() {
            cardsContainer.innerHTML = '';
            const meta = metaData[currentWeek];
            weekTitle.textContent = meta.title;
            volBadge.textContent = meta.vol;
            intBadge.textContent = meta.int;
            focBadge.textContent = meta.foc;

            header.className = `max-w-7xl mx-auto mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border-l-4 shadow-xl transition-all duration-300 ${meta.color}`;
            weekTitle.className = `text-2xl font-heading ${meta.text}`;
            intBadge.className = `text-xl font-heading ${meta.text}`;

            const filteredWods = workouts.filter(w => w.week === currentWeek && (currentDay === 'all' || w.day.toLowerCase() === currentDay.toLowerCase()));

            filteredWods.forEach(w => {
                const isDouble = w.day === "Sabado";
                const colSpan = isDouble ? 'lg:col-span-3' : '';

                let cardHTML = `
                    <article class="bg-slate-800 rounded-xl border ${isDouble ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-700'} overflow-hidden card-hover ${colSpan}">
                       <div class="${isDouble ? 'bg-black' : 'bg-slate-900'} p-4 border-b border-slate-700 flex justify-between items-center relative overflow-hidden">
                          ${isDouble ? '<div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #ef4444 10px, #ef4444 20px);"></div>' : ''}
                          <div class="relative z-10">
                              <h3 class="text-3xl font-heading ${isDouble ? 'text-red-500' : 'text-white'} tracking-widest">${w.day.toUpperCase()}</h3>
                              <span class="text-xs ${isDouble ? 'text-slate-300' : 'text-amber-500'} font-bold uppercase tracking-widest">${w.header}</span>
                          </div>
                          ${isDouble ? '<span class="px-3 py-1 bg-red-600 rounded text-xs font-bold uppercase tracking-wider text-white relative z-10">Clase 2 Horas</span>' : ''}
                       </div>
                       <div class="flex flex-col md:${isDouble ? 'grid md:grid-cols-2 gap-4 p-4' : 'flex-col'}">
                `;

                let timelineHTML = '';
                w.timeline.forEach(item => {
                    timelineHTML += `
                        <div class="flex stretch group">
                            <div class="${item.style.c} w-2 md:w-3 shrink-0 transition-all group-hover:w-4"></div>
                            <div class="p-3 pb-4 border-b border-slate-700/50 flex-1 bg-slate-800/30">
                                <div class="font-bold text-xs ${item.style.t} mb-1 tracking-wider uppercase font-heading text-lg flex items-center gap-2">
                                    <span class="bg-black/50 px-2 py-0.5 rounded text-sm font-sans">${item.time}</span> ${item.title}
                                </div>
                                <div class="text-sm text-slate-300 leading-relaxed">${formatDesc(item.desc)}</div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += timelineHTML;
                cardHTML += `</div></article>`;
                cardsContainer.innerHTML += cardHTML;
            });
        }

        weekFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                weekFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentWeek = parseInt(e.target.getAttribute('data-target'));
                renderCards();
            });
        });

        dayFilters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                dayFilters.forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                currentDay = e.target.getAttribute('data-target');
                renderCards();
            });
        });

        renderCards();
    </script>
